<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Trade - AuraQuant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/tradingview-custom.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #000510 100%);
            color: #ffffff;
        }
        .logo {
            width: 50px;
            height: 50px;
            animation: rotate 10s linear infinite;
        }
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .title {
            font-size: 28px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff88, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .card {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 255, 255, 0.2);
        }
        .card-header {
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid rgba(0, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <div class="container-fluid p-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="title"><i class="fas fa-hand-pointer"></i> Manual Trade Entry</h2>
            <img src="../assets/img/logo-full.png" alt="AuraQuant" class="logo">
        </div>

        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Order Entry</h5>
                    </div>
                    <div class="card-body">
                        <form id="manual-trade-form">
                            <div class="mb-3">
                                <label class="form-label">Symbol</label>
                                <div class="input-group">
                                    <input type="text" class="form-control" id="symbol" placeholder="AAPL" required>
                                    <button class="btn btn-outline-secondary" type="button" onclick="lookupSymbol()">
                                        <i class="fas fa-search"></i>
                                    </button>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Side</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="side" id="buy" value="buy" checked>
                                    <label class="btn btn-outline-success" for="buy">
                                        <i class="fas fa-arrow-up"></i> Buy
                                    </label>
                                    
                                    <input type="radio" class="btn-check" name="side" id="sell" value="sell">
                                    <label class="btn btn-outline-danger" for="sell">
                                        <i class="fas fa-arrow-down"></i> Sell
                                    </label>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Quantity</label>
                                    <input type="number" class="form-control" id="quantity" min="1" required>
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Order Type</label>
                                    <select class="form-control" id="orderType" onchange="togglePriceField()">
                                        <option value="market">Market</option>
                                        <option value="limit">Limit</option>
                                        <option value="stop">Stop</option>
                                        <option value="stop-limit">Stop Limit</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="row" id="priceFields" style="display: none;">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Limit Price</label>
                                    <input type="number" class="form-control" id="limitPrice" step="0.01">
                                </div>
                                
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Stop Price</label>
                                    <input type="number" class="form-control" id="stopPrice" step="0.01">
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Time in Force</label>
                                <select class="form-control" id="timeInForce">
                                    <option value="DAY">Day</option>
                                    <option value="GTC">Good Till Cancel</option>
                                    <option value="IOC">Immediate or Cancel</option>
                                    <option value="FOK">Fill or Kill</option>
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Broker</label>
                                <select class="form-control" id="broker">
                                    <option value="auto">Auto-Select Best</option>
                                    <option value="ibkr">Interactive Brokers</option>
                                    <option value="binance">Binance</option>
                                    <option value="alpaca">Alpaca</option>
                                    <option value="asx-paper">Paper Trading</option>
                                </select>
                            </div>
                            
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-paper-plane"></i> Place Order
                            </button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card mb-3">
                    <div class="card-header">
                        <h5><i class="fas fa-robot"></i> Bot Intelligence Assistant</h5>
                    </div>
                    <div class="card-body">
                        <div id="bot-suggestions" class="mb-3">
                            <div class="alert alert-info">
                                <i class="fas fa-lightbulb"></i> Enter trade details to receive AI-powered suggestions
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Ask Bot Intelligence</label>
                            <div class="input-group">
                                <input type="text" class="form-control" id="bot-query" 
                                       placeholder="What's the best entry point for AAPL?">
                                <button class="btn btn-outline-primary" type="button" onclick="askBot()">
                                    <i class="fas fa-brain"></i> Ask
                                </button>
                            </div>
                        </div>
                        
                        <div id="bot-response"></div>
                    </div>
                </div>
                
                <div class="card">
                    <div class="card-header">
                        <h5>Market Info</h5>
                    </div>
                    <div class="card-body">
                        <div id="market-info">
                            <div class="row">
                                <div class="col-6">
                                    <small class="text-muted">Bid</small>
                                    <h5 id="bid-price">-</h5>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">Ask</small>
                                    <h5 id="ask-price">-</h5>
                                </div>
                            </div>
                            <div class="row mt-3">
                                <div class="col-6">
                                    <small class="text-muted">Volume</small>
                                    <h5 id="volume">-</h5>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">Day Change</small>
                                    <h5 id="day-change">-</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Recent Orders</h5>
                    </div>
                    <div class="card-body">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Symbol</th>
                                    <th>Side</th>
                                    <th>Qty</th>
                                    <th>Price</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="recent-orders">
                                <tr>
                                    <td colspan="7" class="text-center text-muted">No recent orders</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function togglePriceField() {
            const orderType = document.getElementById('orderType').value;
            const priceFields = document.getElementById('priceFields');
            
            if (orderType !== 'market') {
                priceFields.style.display = 'block';
            } else {
                priceFields.style.display = 'none';
            }
        }

        function lookupSymbol() {
            const symbol = document.getElementById('symbol').value;
            console.log('Looking up:', symbol);
            // Will fetch market data from backend
        }

        function askBot() {
            const query = document.getElementById('bot-query').value;
            document.getElementById('bot-response').innerHTML = `
                <div class="alert alert-secondary">
                    <i class="fas fa-spinner fa-spin"></i> Analyzing...
                </div>
            `;
            // Will call AI endpoint
        }

        document.getElementById('manual-trade-form').addEventListener('submit', (e) => {
            e.preventDefault();
            console.log('Submitting trade...');
            // Will submit to backend
        });
    </script>
</body>
</html>
