<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraQuant - Portfolio Dashboard</title>
    <link rel="icon" type="image/png" href="../assets/img/logo-button.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #131722;
            color: #d1d4dc;
            overflow: hidden;
        }
        
        .container {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .header {
            height: 52px;
            background: #1e222d;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            padding: 0 16px;
            justify-content: space-between;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .logo-spin {
            height: 35px;
            width: auto;
            animation: rotate 10s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .page-title {
            font-size: 18px;
            font-weight: 600;
            color: #d1d4dc;
        }
        
        .content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }
        
        .panel {
            background: #1e222d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .panel-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #d1d4dc;
        }
        
        .btn {
            padding: 8px 16px;
            background: #00ff88;
            color: #131722;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }
        
        .btn:hover {
            opacity: 0.9;
        }
        
        .btn-danger {
            background: #ff4444;
        }
        
        .status-green {
            color: #00ff88;
        }
        
        .status-red {
            color: #ff4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <img src="../assets/img/logo-button.png" alt="AuraQuant" class="logo-spin">
                <div class="page-title">Portfolio Dashboard</div>
            </div>
        </div>
        <div class="content">
            <div class="panel">
                <div class="panel-title">Portfolio Dashboard</div>
                
                <p style="color: #787b86; margin-top: 20px;">
                    Portfolio Dashboard functionality will be available soon.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
