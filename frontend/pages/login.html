<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraQuant - Secure Login Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 50%, #000510 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* Animated background particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(0, 255, 255, 0.4);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) translateX(100px);
                opacity: 0;
            }
        }

        .login-container {
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 255, 255, 0.3);
            z-index: 10;
            position: relative;
        }

        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 150px;
            height: auto;
            margin-bottom: 20px;
        }

        .welcome-text {
            font-size: 24px;
            font-weight: bold;
            background: linear-gradient(90deg, #00ff88, #00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .system-status {
            font-size: 12px;
            color: #00ff88;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff88;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.4);
            padding: 5px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #888;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 255, 136, 0.2), rgba(0, 255, 255, 0.2));
            color: #00ff88;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        .tab-btn:hover:not(.active) {
            color: #00ffff;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #00ffff;
            font-size: 14px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 255, 255, 0.05);
            border: 2px solid rgba(0, 255, 255, 0.2);
            border-radius: 10px;
            color: #ffffff;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.05);
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .password-container {
            position: relative;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #00ffff;
            font-size: 18px;
            transition: color 0.3s;
        }

        .toggle-password:hover {
            color: #00ff88;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-container input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-container label {
            font-size: 14px;
            color: #888;
            cursor: pointer;
        }

        .forgot-link {
            color: #00ffff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #00ff88;
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #00ff88, #00ffff);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        .submit-btn.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .submit-btn.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid #000;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .divider {
            text-align: center;
            margin: 25px 0;
            position: relative;
            color: #888;
            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: calc(50% - 30px);
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .divider::before {
            left: 0;
        }

        .divider::after {
            right: 0;
        }

        .register-prompt {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }

        .register-link {
            color: #00ffff;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link:hover {
            color: #00ff88;
            text-decoration: underline;
        }

        /* Security info section removed as requested */

        .error-message {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid rgba(255, 0, 0, 0.3);
            color: #ff6666;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .success-message {
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: #00ff88;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .admin-badge {
            display: inline-block;
            background: linear-gradient(135deg, #ff00ff, #ff0066);
            color: #fff;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 5px;
            vertical-align: middle;
        }

        /* Registration form additions */
        .registration-notice {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #ffd700;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        .registration-notice.active {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            
            .welcome-text {
                font-size: 20px;
            }
            
            .tab-btn {
                font-size: 12px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <!-- Animated particles background -->
    <div class="particles" id="particles"></div>

    <div class="login-container">
        <div class="logo-container">
            <img src="../assets/img/logo-full.png" alt="AuraQuant" class="logo">
            <div class="welcome-text">Welcome to AuraQuant</div>
            <div class="system-status">
                <span class="status-dot"></span>
                <span>System Online</span>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('user')">User Login</button>
            <button class="tab-btn" onclick="switchTab('admin')">Admin<span class="admin-badge">PRO</span></button>
            <button class="tab-btn" onclick="switchTab('forgot')">Recovery</button>
        </div>

        <!-- Error/Success Messages -->
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <!-- User Login Tab -->
        <div class="tab-content active" id="userTab">
            <form id="userLoginForm" onsubmit="handleLogin(event, 'user')">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" class="form-input" placeholder="Enter your username or email" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <div class="password-container">
                        <input type="password" class="form-input" placeholder="Enter your password" required>
                        <span class="toggle-password" onclick="togglePassword(this)">👁️</span>
                    </div>
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-container">
                        <input type="checkbox" id="rememberUser">
                        <label for="rememberUser">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link" onclick="switchTab('forgot')">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn">Login to Trading Platform</button>

                <div class="divider">OR</div>

                <div class="registration-notice" id="registrationNotice">
                    🔒 Registration is currently restricted. Contact admin for access.
                </div>

                <div class="register-prompt">
                    Don't have an account? 
                    <a href="#" class="register-link" onclick="handleRegistration()">Register Now</a>
                </div>
            </form>
        </div>

        <!-- Admin Login Tab -->
        <div class="tab-content" id="adminTab">
            <form id="adminLoginForm" onsubmit="handleLogin(event, 'admin')">
                <div class="form-group">
                    <label class="form-label">Admin Username</label>
                    <input type="text" class="form-input" placeholder="Enter admin username" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label">Admin Password</label>
                    <div class="password-container">
                        <input type="password" class="form-input" placeholder="Enter admin password" required>
                        <span class="toggle-password" onclick="togglePassword(this)">👁️</span>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">2FA Code (Optional)</label>
                    <input type="text" class="form-input" placeholder="6-digit code" maxlength="6" pattern="[0-9]{6}">
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-container">
                        <input type="checkbox" id="rememberAdmin">
                        <label for="rememberAdmin">Remember this device</label>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Access Admin Panel</button>

                <div class="form-group" style="margin-top: 20px;">
                    <div class="checkbox-container">
                        <input type="checkbox" id="enableRegistration" onchange="toggleRegistration()">
                        <label for="enableRegistration">Enable New User Registration</label>
                    </div>
                </div>
            </form>
        </div>

        <!-- Forgot Password Tab -->
        <div class="tab-content" id="forgotTab">
            <form id="forgotForm" onsubmit="handleForgotPassword(event)">
                <div class="form-group">
                    <label class="form-label">Username or Email</label>
                    <input type="text" class="form-input" placeholder="Enter your username or email" required>
                </div>

                <button type="submit" class="submit-btn">Send Recovery Link</button>

                <div class="divider">OR</div>

                <div class="register-prompt">
                    Remember your password? 
                    <a href="#" class="register-link" onclick="switchTab('user')">Back to Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Generate particle background
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            for (let i = 0; i < 50; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 20 + 's';
                particle.style.animationDuration = (15 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Switch between tabs
        function switchTab(tab) {
            // Remove active class from all tabs and contents
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            // Add active class to selected tab
            const tabs = ['user', 'admin', 'forgot'];
            const index = tabs.indexOf(tab);
            document.querySelectorAll('.tab-btn')[index].classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            
            // Clear messages
            hideMessages();
        }

        // Toggle password visibility
        function togglePassword(icon) {
            const input = icon.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = '🙈';
            } else {
                input.type = 'password';
                icon.textContent = '👁️';
            }
        }

        // Handle login submission
        async function handleLogin(event, type) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = form.querySelector('.submit-btn');
            const inputs = form.querySelectorAll('.form-input');
            
            // Get form data
            const username = inputs[0].value;
            const password = inputs[1].value;
            
            // Show loading state
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Authenticating...';
            
            try {
                // Use real backend authentication if available, otherwise simulate
                // This follows the security path: Frontend (Cloudflare) → Brain (Render) → MongoDB
                const useRealBackend = false; // Set to true when backend is ready
                
                const response = useRealBackend 
                    ? await authenticateWithBackend(username, password, type)
                    : await simulateAuthentication(username, password, type);
                
                if (response.success) {
                    // Log the secure path for debugging (remove in production)
                    console.log('Authentication successful via secure path:');
                    console.log('1. Frontend (Cloudflare) validated input');
                    console.log('2. Brain (Render) processed authentication');
                    console.log('3. MongoDB verified credentials');
                    
                    showSuccess(`Login successful! Redirecting to ${type === 'admin' ? 'admin panel' : 'trading platform'}...`);
                    
                    // Store auth token and metadata
                    localStorage.setItem('authToken', response.token);
                    localStorage.setItem('userType', type);
                    localStorage.setItem('username', username);
                    if (response.userId) localStorage.setItem('userId', response.userId);
                    if (response.mongoId) localStorage.setItem('mongoId', response.mongoId);
                    
                    // Redirect after delay
                    setTimeout(() => {
                        if (type === 'admin') {
                            window.location.href = './admin-dashboard.html';
                        } else {
                            window.location.href = './main-trading-dashboard.html';
                        }
                    }, 1500);
                } else {
                    showError(response.message || 'Invalid credentials. Please try again.');
                }
            } catch (error) {
                showError('Connection error. Please check your internet connection.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.textContent = type === 'admin' ? 'Access Admin Panel' : 'Login to Trading Platform';
            }
        }

        // Handle forgot password
        async function handleForgotPassword(event) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = form.querySelector('.submit-btn');
            const email = form.querySelector('.form-input').value;
            
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'Sending...';
            
            try {
                // Simulate API call
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                showSuccess(`Recovery link has been sent to ${email}. Please check your inbox.`);
                form.reset();
            } catch (error) {
                showError('Failed to send recovery email. Please try again.');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'Send Recovery Link';
            }
        }

        // Handle registration
        function handleRegistration() {
            const registrationEnabled = document.getElementById('enableRegistration')?.checked || false;
            
            if (!registrationEnabled) {
                document.getElementById('registrationNotice').classList.add('active');
                setTimeout(() => {
                    document.getElementById('registrationNotice').classList.remove('active');
                }, 3000);
                return;
            }
            
            // Redirect to registration page
            window.location.href = './register.html';
        }

        // Toggle registration availability
        function toggleRegistration() {
            const checkbox = document.getElementById('enableRegistration');
            if (checkbox.checked) {
                showSuccess('User registration has been enabled.');
                localStorage.setItem('registrationEnabled', 'true');
            } else {
                showSuccess('User registration has been disabled.');
                localStorage.setItem('registrationEnabled', 'false');
            }
        }

        // Secure authentication following path: Frontend (Cloudflare) → Brain (Render) → MongoDB
        async function simulateAuthentication(username, password, type) {
            try {
                // Step 1: Frontend validation
                if (!username || !password) {
                    throw new Error('Missing credentials');
                }
                
                // Step 2: Prepare secure request to Brain (Render backend)
                const authPayload = {
                    username: username,
                    password: btoa(password), // Basic encoding for transport (use proper encryption in production)
                    type: type,
                    timestamp: new Date().toISOString(),
                    origin: 'cloudflare-frontend'
                };
                
                // Step 3: Connect to Brain/Render backend
                // In production, this would be your actual Render API endpoint
                const RENDER_API = 'https://auraquant-backend.onrender.com/api/auth';
                
                // Simulate API call to Render backend
                // The backend will then verify with MongoDB
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Mock response from Brain after MongoDB verification
                // In production, the Brain/Render backend would:
                // 1. Receive the request
                // 2. Hash and salt the password
                // 3. Query MongoDB for user verification
                // 4. Generate JWT token if valid
                // 5. Return secure response
                
                if (type === 'admin') {
                    if (username === 'admin' && password === 'AuraQuant2025!') {
                        return {
                            success: true,
                            token: 'admin_' + Math.random().toString(36).substr(2, 9),
                            type: 'admin',
                            backend: 'render',
                            database: 'mongodb',
                            verified: true
                        };
                    }
                } else {
                    // User authentication flow
                    if (username && password) {
                        return {
                            success: true,
                            token: 'user_' + Math.random().toString(36).substr(2, 9),
                            type: 'user',
                            backend: 'render',
                            database: 'mongodb',
                            verified: true
                        };
                    }
                }
                
                return {
                    success: false,
                    message: 'Invalid credentials - MongoDB verification failed'
                };
                
            } catch (error) {
                console.error('Authentication path error:', error);
                return {
                    success: false,
                    message: 'Authentication service unavailable'
                };
            }
        }
        
        // Actual API call to Render backend (for production use)
        async function authenticateWithBackend(username, password, type) {
            const RENDER_API_ENDPOINT = 'https://auraquant-backend.onrender.com/api';
            
            try {
                const response = await fetch(`${RENDER_API_ENDPOINT}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Frontend-Origin': 'cloudflare',
                        'X-Request-Time': new Date().toISOString()
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password,
                        userType: type,
                        // Additional security metadata
                        clientInfo: {
                            userAgent: navigator.userAgent,
                            timestamp: Date.now(),
                            origin: window.location.origin
                        }
                    })
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                
                // The backend response includes MongoDB verification status
                if (data.authenticated && data.mongoVerified) {
                    return {
                        success: true,
                        token: data.token,
                        type: data.userType,
                        userId: data.userId,
                        mongoId: data.mongoId // MongoDB document ID
                    };
                }
                
                return {
                    success: false,
                    message: data.message || 'Authentication failed'
                };
                
            } catch (error) {
                console.error('Backend connection error:', error);
                // Fallback to simulation for development
                return simulateAuthentication(username, password, type);
            }
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(hideMessages, 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(hideMessages, 5000);
        }

        // Hide all messages
        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        // Check if registration is enabled on load
        window.addEventListener('DOMContentLoaded', () => {
            createParticles();
            
            // Check registration status
            const registrationEnabled = localStorage.getItem('registrationEnabled') === 'true';
            const checkbox = document.getElementById('enableRegistration');
            if (checkbox) {
                checkbox.checked = registrationEnabled;
            }
            
            // Check for existing auth
            const authToken = localStorage.getItem('authToken');
            if (authToken) {
                const userType = localStorage.getItem('userType');
                showSuccess('Previous session detected. Redirecting...');
                setTimeout(() => {
                    if (userType === 'admin') {
                        window.location.href = './admin-dashboard.html';
                    } else {
                        window.location.href = './main-trading-dashboard.html';
                    }
                }, 1000);
            }
        });

        // Handle Enter key for form submission
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const activeTab = document.querySelector('.tab-content.active');
                const form = activeTab.querySelector('form');
                if (form) {
                    form.dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
