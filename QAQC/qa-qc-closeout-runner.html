<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraQuant QA/QC Close-Out Test Runner</title>
    <style>
        :root {
            --primary: #00d4ff;
            --secondary: #ff00ff;
            --accent: #00ff00;
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --text: #ffffff;
            --success: #00ff88;
            --warning: #ffaa00;
            --error: #ff0066;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card);
            border-radius: 10px;
            border: 1px solid var(--primary);
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            animation: spin 10s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            color: var(--primary);
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .identity {
            color: var(--accent);
            font-size: 0.9em;
            font-style: italic;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 30px 0;
        }
        
        button {
            padding: 12px 24px;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: var(--text);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
            transition: transform 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .test-container {
            display: grid;
            gap: 20px;
            margin-top: 30px;
        }
        
        .test-category {
            background: var(--card);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .test-name {
            font-size: 1.2em;
            font-weight: bold;
            color: var(--primary);
        }
        
        .test-status {
            padding: 5px 10px;
            border-radius: 5px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .status-pass {
            background: var(--success);
            color: var(--bg);
        }
        
        .status-fail {
            background: var(--error);
            color: var(--text);
        }
        
        .status-pending {
            background: var(--warning);
            color: var(--bg);
        }
        
        .test-score {
            margin-top: 10px;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.8);
        }
        
        .assertions {
            margin-top: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .assertion {
            padding: 8px;
            margin: 5px 0;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .assertion-icon {
            font-size: 1.2em;
        }
        
        .assertion.pass {
            border-left: 3px solid var(--success);
        }
        
        .assertion.fail {
            border-left: 3px solid var(--error);
        }
        
        .summary {
            background: var(--card);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            margin-top: 30px;
        }
        
        .summary h2 {
            color: var(--primary);
            margin-bottom: 20px;
        }
        
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .summary-item {
            text-align: center;
            padding: 15px;
            background: rgba(0, 212, 255, 0.1);
            border-radius: 8px;
        }
        
        .summary-value {
            font-size: 2em;
            font-weight: bold;
            color: var(--accent);
        }
        
        .summary-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 5px;
        }
        
        .report-actions {
            margin-top: 30px;
            padding: 20px;
            background: var(--card);
            border-radius: 10px;
            text-align: center;
        }
        
        .report-actions h3 {
            color: var(--primary);
            margin-bottom: 15px;
        }
        
        .report-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .console-output {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid rgba(0, 212, 255, 0.3);
        }
        
        .console-line {
            margin: 2px 0;
            white-space: pre-wrap;
        }
        
        .console-line.success { color: var(--success); }
        .console-line.error { color: var(--error); }
        .console-line.warning { color: var(--warning); }
        .console-line.info { color: var(--primary); }
        
        #loading {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--card);
            padding: 30px;
            border-radius: 10px;
            border: 2px solid var(--primary);
            z-index: 1000;
        }
        
        #loading.active {
            display: block;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            margin: 0 auto 20px;
            border: 3px solid rgba(0, 212, 255, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#00d4ff" stroke-width="2"/>
                <path d="M50 20 L65 40 L60 50 L65 60 L50 80 L35 60 L40 50 L35 40 Z" 
                      fill="#00d4ff" opacity="0.8"/>
                <circle cx="50" cy="50" r="35" fill="none" stroke="#ff00ff" stroke-width="1" opacity="0.6"/>
                <circle cx="50" cy="50" r="25" fill="none" stroke="#00ff00" stroke-width="1" opacity="0.4"/>
            </svg>
        </div>
        <h1>AuraQuant QA/QC Close-Out Test Suite</h1>
        <div class="identity">Infinity Money Synthetic Intelligence System</div>
        <div style="margin-top: 10px; color: #888;">ADD-ONLY • NO REBUILD • NO RESTYLE • BRANDING & LOGO HARD-LOCK</div>
    </div>
    
    <div class="controls">
        <button id="runTests" onclick="runTests()">🏁 Run Close-Out Tests</button>
        <button id="clearResults" onclick="clearResults()">🔄 Clear Results</button>
        <button id="exportReport" onclick="exportReport()" disabled>📊 Export Report</button>
        <button id="exportSummary" onclick="exportSummary()" disabled>📝 Export Summary</button>
    </div>
    
    <div id="loading">
        <div class="loading-spinner"></div>
        <div style="text-align: center; color: var(--primary);">Running QA/QC Tests...</div>
    </div>
    
    <div id="testContainer" class="test-container"></div>
    
    <div id="summary" class="summary" style="display: none;">
        <h2>Test Summary</h2>
        <div class="summary-grid">
            <div class="summary-item">
                <div class="summary-value" id="summaryTotal">0</div>
                <div class="summary-label">Total Tests</div>
            </div>
            <div class="summary-item">
                <div class="summary-value" id="summaryPassed" style="color: var(--success);">0</div>
                <div class="summary-label">Passed</div>
            </div>
            <div class="summary-item">
                <div class="summary-value" id="summaryFailed" style="color: var(--error);">0</div>
                <div class="summary-label">Failed</div>
            </div>
            <div class="summary-item">
                <div class="summary-value" id="summaryRate">0%</div>
                <div class="summary-label">Success Rate</div>
            </div>
        </div>
    </div>
    
    <div id="reportActions" class="report-actions" style="display: none;">
        <h3>Test Complete - Export Results</h3>
        <div class="report-buttons">
            <button onclick="copyReportToClipboard()">📋 Copy Report JSON</button>
            <button onclick="copySummaryToClipboard()">📋 Copy Summary MD</button>
            <button onclick="downloadReport()">💾 Download Report</button>
            <button onclick="downloadSummary()">💾 Download Summary</button>
        </div>
    </div>
    
    <div class="console-output" id="consoleOutput"></div>
    
    <!-- Load Capital Protection Module (simulated) -->
    <script>
        // Simulate capital protection module for testing
        window.capitalProtection = {
            dataSource: 'PRIMARY',
            engineMode: 'RUNNING',
            handleConnectionDegradation: function() {
                this.engineMode = 'DEGRADED';
            },
            handleDataSourceChange: function(source) {
                this.dataSource = source;
                if (source === 'FALLBACK') {
                    this.engineMode = 'FALLBACK';
                } else if (source === 'PRIMARY') {
                    this.engineMode = 'RECOVERING';
                    setTimeout(() => { this.engineMode = 'RUNNING'; }, 100);
                }
                return Promise.resolve();
            }
        };
    </script>
    
    <!-- Load QA/QC Test Suite and all test modules -->
    <script src="qa-qc-closeout.js"></script>
    <script src="test-trading-mode-switch.js"></script>
    <script src="test-data-persistence.js"></script>
    <script src="test-notification-matrix.js"></script>
    <script src="test-regulatory-gates.js"></script>
    <script src="test-capital-protection-deep.js"></script>
    <script src="test-performance.js"></script>
    
    <script>
        let testResults = null;
        
        function addConsoleMessage(message, type = 'info') {
            const output = document.getElementById('consoleOutput');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = message;
            output.appendChild(line);
            output.scrollTop = output.scrollHeight;
        }
        
        async function runTests() {
            // Clear previous results
            clearResults();
            
            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('runTests').disabled = true;
            
            addConsoleMessage('🏁 Starting AuraQuant QA/QC Close-Out Tests...', 'info');
            addConsoleMessage('Identity: AuraQuant is the Infinity Money Synthetic Intelligence System', 'success');
            
            try {
                const tester = new AuraQuantQAQCCloseOut();
                testResults = await tester.runCloseOutTests();
                
                displayResults(testResults);
                
                // Enable export buttons
                document.getElementById('exportReport').disabled = false;
                document.getElementById('exportSummary').disabled = false;
                
                // Show report actions
                document.getElementById('reportActions').style.display = 'block';
                
                addConsoleMessage(`✅ Tests Complete! Overall Status: ${testResults.final_status}`, 
                    testResults.final_status === 'PASS' ? 'success' : 'error');
                
            } catch (error) {
                addConsoleMessage(`❌ Test execution error: ${error.message}`, 'error');
                console.error(error);
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('runTests').disabled = false;
            }
        }
        
        function displayResults(results) {
            const container = document.getElementById('testContainer');
            
            // Display each test category
            for (const [key, test] of Object.entries(results.tests)) {
                const testDiv = document.createElement('div');
                testDiv.className = 'test-category';
                
                const statusClass = test.status === 'PASS' ? 'status-pass' : 'status-fail';
                
                testDiv.innerHTML = `
                    <div class="test-header">
                        <div class="test-name">${test.name}</div>
                        <div class="test-status ${statusClass}">${test.status}</div>
                    </div>
                    <div class="test-score">
                        Score: ${test.score} (${test.percentage})
                    </div>
                    <div class="assertions">
                        ${test.assertions.slice(0, 5).map(a => `
                            <div class="assertion ${a.passed ? 'pass' : 'fail'}">
                                <span class="assertion-icon">${a.passed ? '✅' : '❌'}</span>
                                <span>${a.check}</span>
                            </div>
                        `).join('')}
                        ${test.assertions.length > 5 ? 
                            `<div style="text-align: center; margin-top: 10px; color: #888;">
                                ... and ${test.assertions.length - 5} more assertions
                            </div>` : ''}
                    </div>
                `;
                
                container.appendChild(testDiv);
            }
            
            // Display summary
            const summary = document.getElementById('summary');
            summary.style.display = 'block';
            document.getElementById('summaryTotal').textContent = results.summary.total;
            document.getElementById('summaryPassed').textContent = results.summary.passed;
            document.getElementById('summaryFailed').textContent = results.summary.failed;
            document.getElementById('summaryRate').textContent = results.success_rate;
        }
        
        function clearResults() {
            document.getElementById('testContainer').innerHTML = '';
            document.getElementById('summary').style.display = 'none';
            document.getElementById('reportActions').style.display = 'none';
            document.getElementById('consoleOutput').innerHTML = '';
            testResults = null;
        }
        
        function exportReport() {
            if (!testResults) return;
            
            const json = JSON.stringify(testResults, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `auraquant-qa-closeout-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
            
            addConsoleMessage('📊 Report exported successfully!', 'success');
        }
        
        function exportSummary() {
            const summary = localStorage.getItem('qa-qc-closeout-summary');
            if (!summary) return;
            
            const blob = new Blob([summary], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `auraquant-qa-closeout-summary-${new Date().toISOString().split('T')[0]}.md`;
            a.click();
            URL.revokeObjectURL(url);
            
            addConsoleMessage('📝 Summary exported successfully!', 'success');
        }
        
        function copyReportToClipboard() {
            const report = localStorage.getItem('qa-qc-closeout-report');
            if (!report) return;
            
            navigator.clipboard.writeText(report).then(() => {
                addConsoleMessage('📋 Report copied to clipboard!', 'success');
            });
        }
        
        function copySummaryToClipboard() {
            const summary = localStorage.getItem('qa-qc-closeout-summary');
            if (!summary) return;
            
            navigator.clipboard.writeText(summary).then(() => {
                addConsoleMessage('📋 Summary copied to clipboard!', 'success');
            });
        }
        
        function downloadReport() {
            exportReport();
        }
        
        function downloadSummary() {
            exportSummary();
        }
    </script>
</body>
</html>
